services:
  - type: web
    name: forchi
    runtime: docker
    plan: free
    healthCheckPath: /
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: GEMINI_KEYS
        sync: false
      - key: HF_TOKEN
        sync: false
      - key: FACEBOOK_PAGE_ID
        sync: false
      - key: FACEBOOK_PAGE_ACCESS_TOKEN
        sync: false
      - key: LINKEDIN_ACCESS_TOKEN
        sync: false
      - key: LINKEDIN_AUTHOR_URN
        sync: false
      - key: NODE_ENV
        value: production
      - key: DATABASE_PATH
        value: ./data/forchi.db
      - key: AUTO_MODE_DEFAULT
        value: "true"
      - key: CHAT_PROVIDER
        value: "gemini"
      - key: GROQ_API_KEY
        sync: false
      - key: SERPER_API_KEY
        sync: false
      - key: EXA_API_KEY
        sync: false
      - key: FIRECRAWL_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: LLM_ENDPOINT
        value: https://slymun-forchi.hf.space
      - key: ZEROGPU_ENDPOINT
        value: https://slymun-forchi-img.hf.space
