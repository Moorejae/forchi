name: Keep bot service alive

on:
  schedule:
    # Ping every 10 minutes to keep the Render free-tier service awake
    # (Render sleeps after 15 min of HTTP inactivity).
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping ForChi service health endpoint
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 https://milo-agent.onrender.com)
          echo "Service responded with HTTP $code"
          if [ "$code" != "200" ]; then
            echo "::warning::Service responded with HTTP $code (expected 200)"
          fi
